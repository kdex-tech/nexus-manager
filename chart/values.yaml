# [CERT-MANAGER]: To enable cert-manager injection to webhooks set true
certmanager:
  enable: true

# [CONFIG]: Configuration for the controller-manager
config:
  backendDefault:
    # 0.1.6 is the first tag that runs as a non-root user (uid 65532) and
    # listens on port 8080 instead of 80 - required for the embedded
    # default BackendDefault.Deployment template in kdex-crds to actually
    # admit Pods under PodSecurity "restricted" namespaces. Earlier tags
    # (<=0.1.5) bind to port 80 and run as root, incompatible with the
    # restricted profile's CAP_NET_BIND_SERVICE drop and runAsNonRoot
    # requirement.
    # 0.1.8 emits a default Cache-Control (no-cache) so browsers honor the
    # ETag/Last-Modified validators file_server already sets - fixes stale
    # /-/modules/* app bundles and /-/theme/* assets executing across updates
    # (kdex-tech/backend-static#3, kdex-tech/host-manager#139). Overridable via
    # the CACHE_CONTROL env on the backend.
    serverImage: ghcr.io/kdex-tech/backend-static:0.1.8
    serverImagePullPolicy: IfNotPresent
  defaultImageRegistry: docker.io
  defaultNpmRegistry: registry.npmjs.org
  packages:
    packagerImage: ghcr.io/kdex-tech/cli-tools:0.3.19
    packagerImagePullPolicy: IfNotPresent
    # 0.4.0 adds a verification ledger on the packages cache claim. It is a
    # no-op while packages.cacheClaim is unset below — no claim means no ledger
    # and the cold verify path every Job, exactly as 0.3.3 behaved — so this
    # bump is behaviour-preserving until that claim is configured.
    toolsImage: ghcr.io/kdex-tech/node-tools:0.4.0
    toolsImagePullPolicy: IfNotPresent
    # Packaging-pipeline knobs (node-tools >= 0.3.0, kdex-tech/node-tools#3).
    # Empty = image defaults (npm + node), byte-identical to prior behavior.
    installer: ""   # "" (npm) | bun    — dependency install in get_modules
    runtime: ""     # "" (node) | bun | deno — runs optimize/generate/bundle_cjs
    # Per-host PVC (this namespace) mounted at /cache to persist the npm+bun
    # download cache across packaging Jobs — reusable ("warm") installs.
    # Empty = ephemeral cache (cold). Operator provisions the PVC (RWO).
    cacheClaim: ""
    # Packager Job container resources. The memory default is sized for the
    # bun installer — npm fits in 256Mi, but bun's dependency-resolution peak
    # does not and OOMKills at a LimitRange's 256Mi default. Raise for large
    # dependency sets. See kdex-tech/nexus-manager#34.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # Packager Job pod placement. With none set the pod lands on whatever
    # untainted node exists — on a segregated cluster that's the cold,
    # scale-from-zero build pool, adding a node spin-up to every run. Steer it
    # onto a warm, appropriately-tainted pool. See kdex-tech/nexus-manager#35.
    nodeSelector: {}      # -> packager Job pod nodeSelector
    tolerations: []       # -> packager Job pod tolerations
    affinity: {}          # -> packager Job pod affinity (empty = scheduler default)

# [MANAGER]: Manager Deployment Configurations
controllerManager:
  container:
    args:
    - "--leader-elect"
    - "--metrics-bind-address=:8443"
    - "--health-probe-bind-address=:8081"
    extraArgs: {}
      # x-foo:
      # - "--zap-log-level=info"
    extraEnv: {}
      # x-foo:
      # - name: FOO
      #   value: BAR
    image:
      repository: ghcr.io/kdex-tech/nexus-manager
      tag: ""
    imagePullPolicy: IfNotPresent
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8081
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /readyz
        port: 8081
      initialDelaySeconds: 5
      periodSeconds: 10
    # Manager pod resources. Sized for the in-process Helm render:
    # reconcileHelmReleases loads and decompresses each host's host-manager
    # chart onto the operator heap via the embedded Helm SDK, so the spike is
    # hundreds of MiB above the ~200Mi steady state. The previous 128Mi default
    # OOMKilled the operator mid-`helm upgrade` on a two-host fleet, and 512Mi
    # OOMKilled it again -- an OOM there wedges the release in pending-upgrade
    # until its orphaned revision Secret is deleted by hand. See #40.
    #
    # The 256Mi request also lowers the pod's oom_score_adj, making it a less
    # likely victim under genuine node pressure. CPU request stays at 10m so
    # this does not inflate a tight system pool's CPU-request budget.
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 10m
        memory: 256Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - "ALL"
  replicas: 1
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  terminationGracePeriodSeconds: 10

# These labels are applied to all resources in the chart
extraChartLabels: {}

# [SCHEDULING]: Pod placement for the manager Deployment. Top-level keys
# matching the helm convention used by cert-manager / external-secrets /
# traefik etc.; empty values are omitted from the rendered podSpec.
affinity: {}
nodeSelector: {}
tolerations: []

# [METRICS]: Set to true to generate manifests for exporting metrics.
# To disable metrics export set false, and ensure that the
# ControllerManager argument "--metrics-bind-address=:8443" is removed.
metrics:
  enable: true

# [NETWORK POLICIES]: To enable NetworkPolicies set true
networkPolicy:
  enable: false

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# [RBAC]: To enable RBAC (Permissions) configurations
rbac:
  enable: true

serviceAccount:
  # Annotations to add to the service account
  annotations: {}
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true
