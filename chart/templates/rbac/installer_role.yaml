{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "kcnas-operator.labels" . | nindent 4 }}
  name: kcnas-operator-installer
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      kdex.dev/aggregate-to-installer: "true"
{{- end -}}
