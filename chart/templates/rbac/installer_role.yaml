{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: kcnas-operator
    app.kubernetes.io/name: {{ include "kcnas-operator.name" . }}
    helm.sh/chart: {{ include "kcnas-operator.chart" . }}
  name: {{ include "kcnas-operator.fullname" . }}-installer
aggregationRule:
  clusterRoleSelectors:
  - matchLabels:
      kdex.dev/aggregate-to-installer: "true"
rules: []
{{- end -}}
