{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "kcnas-operator.labels" . | nindent 4 }}
    kdex.dev/aggregate-to-installer: "true"
  name: kcnas-operator-installer-base
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - secrets
  - serviceaccounts
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kdex.dev
  resources:
  - kdexapps
  - kdexfaasadaptors
  - kdexfunctions
  - kdexhostextensions
  - kdexpagearchetypes
  - kdexpagefooters
  - kdexpageheaders
  - kdexpagenavigations
  - kdexpages
  - kdexrolebindings
  - kdexroles
  - kdexscriptlibraries
  - kdexthemes
  - kdextranslations
  - kdexutilitypages
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  - roles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - bind
  - escalate
{{- end -}}
