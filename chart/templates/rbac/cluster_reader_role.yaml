{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: kcnas-operator
    app.kubernetes.io/name: {{ include "kcnas-operator.name" . }}
    helm.sh/chart: {{ include "kcnas-operator.chart" . }}
  name: {{ include "kcnas-operator.fullname" . }}-host-manager-cluster-reader
rules:
- apiGroups:
  - kdex.dev
  resources:
  - kdexclusterapps
  - kdexclusterfaasadaptors
  - kdexclusterpagearchetypes
  - kdexclusterpagefooters
  - kdexclusterpageheaders
  - kdexclusterpagenavigations
  - kdexclusterscriptlibraries
  - kdexclusterthemes
  - kdexclustertranslations
  - kdexclusterutilitypages
  verbs:
  - get
  - list
  - watch
{{- end -}}
