{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "kcnas-operator.labels" . | nindent 4 }}
  name: kcnas-operator-host-manager-cluster-reader
rules:
- apiGroups:
  - kdex.dev
  resources:
  - kdexclusterapps
  - kdexclusterfaasadaptors
  - kdexclusterpagearchetypes
  - kdexclusterpagefooters
  - kdexclusterpageheaders
  - kdexclusterpagenavigations
  - kdexclusterscriptlibraries
  - kdexclusterthemes
  - kdexclustertranslations
  - kdexclusterutilitypages
  verbs:
  - get
  - list
  - watch
{{- end -}}
