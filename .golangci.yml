version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Table-driven tests repeat literals by construction -- the same status
      # string across twenty cases is the point of the table, not a missing
      # constant.
      ignore-tests: true
      # OpenAPI document vocabulary: `description` is a key defined by the
      # spec, and the generated document is more readable spelled the way the
      # spec spells it than behind a constant.
      ignore-string-values:
        - "description"
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - lll
        path: ./*
    paths:
      - test$
      - third_party$
      - builtin$
      - examples$
      - _test.go$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
